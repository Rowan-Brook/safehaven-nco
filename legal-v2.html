<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal &amp; Policies</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: #e5e7eb;
      --chip-bg: #eef4ff;
      --chip-text: #1d4ed8;
      --chip-active-bg: #1d4ed8;
      --chip-active-text: #ffffff;
      --doc-header-bg: #f9fafb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 24px 96px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    h1.page-title {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .page-subtitle {
      margin: 0 0 28px;
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 66ch;
    }

    .doc-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .doc-chip {
      appearance: none;
      border: 1px solid transparent;
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .doc-chip:hover {
      filter: brightness(0.97);
    }

    .doc-chip[aria-selected="true"] {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    .document-sheet {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      overflow: hidden;
    }

    .document-meta {
      padding: 20px 28px;
      background: var(--doc-header-bg);
      border-bottom: 1px solid var(--border);
    }

    .document-title {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .document-updated {
      margin: 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .document-body {
      padding: 28px;
    }

    .document-body h2 {
      margin: 24px 0 8px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .document-body h2:first-child {
      margin-top: 0;
    }

    .document-body p {
      margin: 0 0 12px;
      color: var(--text);
    }

    .document-body p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="container" id="legal-docs-app">
    <h1 class="page-title" id="ui-page-title"></h1>
    <p class="page-subtitle" id="ui-page-subtitle"></p>

    <nav class="doc-nav" id="ui-doc-tabs" role="tablist" aria-label="Documents"></nav>

    <article class="document-sheet" id="ui-doc-sheet" role="tabpanel">
      <header class="document-meta">
        <h2 class="document-title" id="ui-doc-title"></h2>
        <p class="document-updated" id="ui-doc-updated"></p>
      </header>
      <div class="document-body" id="ui-doc-content"></div>
    </article>
  </main>

  <script>
    const DOCS_DATA = {
      en: {
        pageTitle: "Legal & Policies",
        pageSubtitle: "Unified documentation package for the personal portfolio of Nodirjon Tolipov (Rowan Brook) and the Safe Haven initiative.",
        tabsLabel: "Documents",
        updatedPrefix: "Last updated",
        docs: [
          {
            id: "privacy",
            tab: "1. Privacy Policy",
            title: "Privacy Policy",
            updated: "November 2026",
            sections: [
              {
                heading: "1. Scope and Information Collected",
                text: "This policy describes how information submitted through portfolio or initiative forms is handled. Only details voluntarily provided by the user are processed for communication or evaluation purposes."
              },
              {
                heading: "2. Purpose of Processing",
                text: "Submitted information is used solely to respond to inquiries, review academic or partnership proposals, and maintain operational records without selling data to third parties."
              },
              {
                heading: "3. Retention and Protection",
                text: "Records are kept only as long as necessary to fulfill their stated purpose and are protected with reasonable technical and organizational safeguards."
              }
            ]
          },
          {
            id: "terms",
            tab: "2. Terms of Use",
            title: "Terms of Use",
            updated: "November 2026",
            sections: [
              {
                heading: "1. Informational Purpose",
                text: "All materials, descriptions, and documentation presented on this site are provided for informational and portfolio demonstration purposes."
              },
              {
                heading: "2. Intellectual Property",
                text: "Unless noted otherwise, texts, layouts, and custom materials belong to their respective authors and may not be republished commercially without prior permission."
              },
              {
                heading: "3. Changes to Documentation",
                text: "Document contents and structure may be updated periodically to reflect current project or academic materials."
              }
            ]
          },
          {
            id: "safe-haven",
            tab: "3. Safe Haven Concept Disclaimer",
            title: "Safe Haven Concept Disclaimer",
            updated: "November 2026",
            sections: [
              {
                heading: "1. Conceptual Status",
                text: "Safe Haven is presented as an educational and social-impact initiative model. Parameters such as cohort size, curriculum duration, and agreement terms are subject to formal legal and operational structuring."
              },
              {
                heading: "2. No Binding Offer",
                text: "Published concept notes and structural outlines do not constitute a finalized public offer or binding financial contract until formally executed under applicable law."
              }
            ]
          },
          {
            id: "partnerships",
            tab: "4. Partnership & Donations Notice",
            title: "Partnership & Donations Notice",
            updated: "November 2026",
            sections: [
              {
                heading: "1. Institutional and Academic Inquiries",
                text: "Academic collaborations, mentorship discussions, and organizational partnerships are evaluated individually based on scope, timelines, and mutual alignment."
              },
              {
                heading: "2. Contributions and Sponsorship",
                text: "Any financial support or sponsorship arrangements require explicit written terms defining scope, allocation, and applicable legal rules."
              }
            ]
          }
        ]
      },
      ru: {
        pageTitle: "Правовая информация и политики",
        pageSubtitle: "Единый пакет документации для портфолио Нодирджона Толипова (Rowan Brook) и инициативы Safe Haven.",
        tabsLabel: "Документы",
        updatedPrefix: "Последнее обновление",
        docs: [
          {
            id: "privacy",
            tab: "1. Политика конфиденциальности",
            title: "Политика конфиденциальности",
            updated: "Ноябрь 2026",
            sections: [
              {
                heading: "1. Область действия и собираемые данные",
                text: "Настоящая политика описывает порядок обработки сведений, переданных через формы портфолио или инициативы. Обрабатываются только данные, добровольно указанные пользователем для связи или рассмотрения запроса."
              },
              {
                heading: "2. Цели обработки",
                text: "Сведения используются исключительно для ответов на обращения, рассмотрения академических или партнёрских предложений и ведения учётных записей без передачи третьим лицам в коммерческих целях."
              },
              {
                heading: "3. Хранение и защита",
                text: "Данные хранятся в течение срока, необходимого для заявленных целей, с применением базовых технических и организационных мер защиты."
              }
            ]
          },
          {
            id: "terms",
            tab: "2. Условия использования",
            title: "Условия использования",
            updated: "Ноябрь 2026",
            sections: [
              {
                heading: "1. Информационный характер",
                text: "Все материалы, описания и документы на данном ресурсе представлены в ознакомительных и портфолио-целях."
              },
              {
                heading: "2. Интеллектуальная собственность",
                text: "Если не указано иное, тексты, структура и авторские материалы принадлежат их правообладателям и не могут использоваться в коммерческих целях без согласования."
              },
              {
                heading: "3. Обновление документов",
                text: "Содержание и структура документов могут обновляться по мере развития проектов и учебных материалов."
              }
            ]
          },
          {
            id: "safe-haven",
            tab: "3. Уведомление о концепции Safe Haven",
            title: "Уведомление о концепции Safe Haven",
            updated: "Ноябрь 2026",
            sections: [
              {
                heading: "1. Статус концепции",
                text: "Safe Haven представлен как модель образовательной и социальной инициативы. Параметры потоков, длительность программ и условия договоров подлежат формальному правовому и организационному оформлению."
              },
              {
                heading: "2. Отсутствие публичной оферты",
                text: "Опубликованные концептуальные материалы и схемы не являются окончательной публичной офертой или обязывающим финансовым договором до оформления в установленном законом порядке."
              }
            ]
          },
          {
            id: "partnerships",
            tab: "4. Уведомление о партнёрстве и пожертвованиях",
            title: "Уведомление о партнёрстве и пожертвованиях",
            updated: "Ноябрь 2026",
            sections: [
              {
                heading: "1. Академические и организационные запросы",
                text: "Предложения о сотрудничестве, наставничестве и партнёрстве рассматриваются индивидуально с учётом задач, сроков и взаимных целей."
              },
              {
                heading: "2. Поддержка и спонсорство",
                text: "Любые формы финансовой поддержки или спонсорского участия оформляются отдельными письменными условиями с указанием назначения и применимых норм права."
              }
            ]
          }
        ]
      }
    };

    const SUPPORTED_LANGS = Object.keys(DOCS_DATA);

    function normalizeLang(raw) {
      if (!raw || typeof raw !== "string") return null;
      const code = raw.toLowerCase().split("-")[0].trim();
      return SUPPORTED_LANGS.includes(code) ? code : null;
    }

    function detectSiteLanguage() {
      const candidates = [
        window.__SITE_LANG__,
        document.documentElement.getAttribute("lang"),
        localStorage.getItem("siteLang"),
        localStorage.getItem("lang"),
        new URLSearchParams(window.location.search).get("lang")
      ];

      for (const value of candidates) {
        const normalized = normalizeLang(value);
        if (normalized) return normalized;
      }
      return "en";
    }

    let currentLang = detectSiteLanguage();
    let activeDocIndex = 0;

    function render() {
      const langPack = DOCS_DATA[currentLang] || DOCS_DATA.en;
      const activeDoc = langPack.docs[activeDocIndex] || langPack.docs[0];

      document.title = langPack.pageTitle;
      document.getElementById("ui-page-title").textContent = langPack.pageTitle;
      document.getElementById("ui-page-subtitle").textContent = langPack.pageSubtitle;

      const tabsEl = document.getElementById("ui-doc-tabs");
      tabsEl.setAttribute("aria-label", langPack.tabsLabel);
      tabsEl.innerHTML = "";

      langPack.docs.forEach((doc, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "doc-chip";
        btn.role = "tab";
        btn.id = `doc-tab-${doc.id}`;
        btn.setAttribute("aria-selected", idx === activeDocIndex ? "true" : "false");
        btn.setAttribute("aria-controls", "ui-doc-sheet");
        btn.textContent = doc.tab;
        btn.addEventListener("click", () => {
          activeDocIndex = idx;
          render();
        });
        tabsEl.appendChild(btn);
      });

      document.getElementById("ui-doc-sheet").setAttribute("aria-labelledby", `doc-tab-${activeDoc.id}`);
      document.getElementById("ui-doc-title").textContent = activeDoc.title;
      document.getElementById("ui-doc-updated").textContent = `${langPack.updatedPrefix}: ${activeDoc.updated}`;

      const contentEl = document.getElementById("ui-doc-content");
      contentEl.innerHTML = "";

      activeDoc.sections.forEach((sec) => {
        const h2 = document.createElement("h2");
        h2.textContent = sec.heading;
        const p = document.createElement("p");
        p.textContent = sec.text;
        contentEl.appendChild(h2);
        contentEl.appendChild(p);
      });
    }

    function syncWithSiteLanguage() {
      const detected = detectSiteLanguage();
      if (detected !== currentLang) {
        currentLang = detected;
        render();
      }
    }

    const htmlObserver = new MutationObserver(() => syncWithSiteLanguage());
    htmlObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["lang"]
    });

    window.addEventListener("storage", syncWithSiteLanguage);
    window.addEventListener("site:langchange", (e) => {
      const nextLang = normalizeLang(e?.detail?.lang) || detectSiteLanguage();
      if (nextLang !== currentLang) {
        currentLang = nextLang;
        render();
      }
    });

    render();
  </script>
</body>
</html>
